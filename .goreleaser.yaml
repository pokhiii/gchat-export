version: 2

builds:
  - main: ./cmd/gchat-export
    binary: gchat-export
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  # Bare executables: download one file and run it.
  - id: binaries
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Archives with the license and docs alongside the executable.
  - id: archives
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - docs/setup.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    ids: [archives]
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    documents: ["{{ .ArtifactName }}.cdx.json"]

signs:
  # cosign v3 writes a single Sigstore bundle (signature + certificate +
  # transparency-log proof) instead of separate .sig/.pem files.
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: github
